<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>卡密预设 · 脚本 harness</title>
<!-- 酒馆页面本来就把 showdown / DOMPurify 挂在 window 上（public/lib.js 的 initLibraryShims），
     酒馆助手又把它们合并进脚本 iframe（predefine.js:12）。引导的免责声明按真 markdown 渲染靠它们；
     这两个文件取自本机酒馆安装目录（/vendor/*，见 server.mjs），拿不到就退回迷你排版。 -->
<script src="/vendor/showdown.js"></script>
<script src="/vendor/dompurify.js"></script>
<style>
  body { background:#111; color:#ddd; font-family: ui-monospace, Consolas, monospace; margin:0; padding:12px; }
  h1 { font-size:15px; margin:0 0 8px; color:#b07dff; }
  #tavern { border:1px dashed #444; padding:8px; margin-bottom:10px; }
  #qr-bar { display:flex; gap:6px; margin-bottom:8px; min-height:26px; }
  .qr--button { background:#2a2a33; border:1px solid #444; border-radius:6px; padding:3px 8px; color:#ddd; cursor:pointer; }
  .qr--button-label { pointer-events:none; }
  #results { white-space:pre-wrap; background:#181820; border:1px solid #333; border-radius:6px; padding:10px; font-size:12px; line-height:1.5; }
</style>
</head>
<body>
<h1>卡密预设 · 脚本 harness（模拟酒馆页面 + 酒馆助手 4.9.5 接口）</h1>
<div id="tavern">
  <div id="qr-bar"></div>
  <div id="chat"><div class="mes"><div class="mes_text">模拟聊天</div></div></div>
  <textarea id="send_textarea"></textarea>
</div>
<pre id="results">running…</pre>

<script>
/* ============================================================
 * 模拟「酒馆助手 4.9.5」注入到【脚本 iframe】里的全局接口
 * 依据：本机酒馆实际安装的 dist/index.js（4.9.5）实现
 *   replaceScriptButtons(script_id?, buttons) / getButtonEvent(name)
 *   eventOn(evt, cb) -> { stop() } / eventRemoveListener / getScriptButtons ...
 * 另外给每个 iframe 装定时器探针，用来证明注销后没有定时器残留。
 * ============================================================ */
const STATE = { buttons: new Map(), visible: new Map(), handlers: new Map(), logs: [] };

STATE.render = function render() {
  const bar = document.getElementById('qr-bar');
  bar.textContent = '';
  for (const [id, list] of STATE.visible) {
    for (const b of list) {
      if (b.visible === false) continue;
      const btn = document.createElement('button');
      btn.className = 'qr--button';
      btn.innerHTML = '<span class="qr--button-label"></span>';
      btn.querySelector('.qr--button-label').textContent = b.name;
      btn.setAttribute('data-script', id);
      btn.addEventListener('click', () => {
        const evt = 'button:' + id + ':' + b.name;
        const m = STATE.handlers.get(evt);
        if (m && m.size) { for (const w of [...m.values()]) w(); }
        else { STATE.logs.push('（无人监听 ' + evt + '）'); }
      });
      bar.appendChild(btn);
    }
  }
};

function installMocks(w, scriptId) {
  w.__scriptVars = {};
  w.__timers = new Set();
  const rawSetInterval = w.setInterval.bind(w), rawClearInterval = w.clearInterval.bind(w);
  w.setInterval = function (fn, ms) { const id = rawSetInterval(fn, ms); w.__timers.add(id); return id; };
  w.clearInterval = function (id) { w.__timers.delete(id); return rawClearInterval(id); };

  w.getScriptId = () => scriptId;
  w.getIframeName = () => 'TH-script--test--' + scriptId;
  w.getScriptButtons = () => (STATE.buttons.get(scriptId) || []).slice();
  w.replaceScriptButtons = (a, b) => {
    const list = (typeof a === 'string' ? b : a) || [];
    STATE.buttons.set(scriptId, JSON.parse(JSON.stringify(list)));
    STATE.visible.set(scriptId, JSON.parse(JSON.stringify(list)));
    STATE.render();
  };
  w.appendInexistentScriptButtons = (list) => {
    const cur = STATE.buttons.get(scriptId) || [];
    w.replaceScriptButtons([...cur, ...(list || []).filter(x => !cur.some(y => y.name === x.name))]);
  };
  w.getButtonEvent = (name) => 'button:' + scriptId + ':' + name;
  w.eventOn = (evt, cb) => {
    if (!STATE.handlers.has(evt)) STATE.handlers.set(evt, new Map());
    STATE.handlers.get(evt).set(cb, cb);
    return { stop: () => { STATE.handlers.get(evt).delete(cb); } };
  };
  w.eventRemoveListener = (evt, cb) => { const m = STATE.handlers.get(evt); if (m) m.delete(cb); };
  w.eventClearAll = () => { STATE.handlers.clear(); };
  w.getAllEnabledScriptButtons = () => {
    const out = {};
    for (const [id, list] of STATE.buttons) out[id] = list.map(b => ({ button_id: b.name, button_name: b.name }));
    return out;
  };
  w.getScriptTrees = () => [];
  w.getVariables = (opt) => (opt && opt.type === 'script') ? w.__scriptVars : {};
  w.replaceVariables = (v, opt) => { if (opt && opt.type === 'script') w.__scriptVars = JSON.parse(JSON.stringify(v)); };
  w.updateVariablesWith = (fn, opt) => { const v = fn(w.getVariables(opt)); w.replaceVariables(v, opt); return v; };
}

const FRAMES = {};
async function loadScript(file, scriptId) {
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'width:0;height:0;border:0;position:absolute;left:-9999px';
  iframe.src = 'about:blank';
  document.body.appendChild(iframe);
  await new Promise(r => { iframe.onload = r; setTimeout(r, 800); });
  const w = iframe.contentWindow;
  installMocks(w, scriptId);
  const code = await (await fetch(file)).text();
  w.eval(code);
  FRAMES[scriptId] = { iframe, w };
  return FRAMES[scriptId];
}

const R = [];
function check(name, cond, extra) {
  R.push((cond ? 'PASS  ' : 'FAIL  ') + name + (extra !== undefined ? '   [' + extra + ']' : ''));
  return cond;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const labels = () => [...document.querySelectorAll('#qr-bar .qr--button-label')].map(e => e.textContent);
function report() {
  const failed = R.filter(x => x.startsWith('FAIL')).length;
  document.getElementById('results').textContent = R.join('\n') + '\n\n==== ' + (failed ? failed + ' 项失败' : '全部 ' + R.length + ' 项通过') + ' ====';
  document.title = (failed ? 'FAIL:' + failed : 'PASS') + ' | 卡密预设 harness';
  return failed;
}

(async function main() {
  const HOST = window;
  await loadScript('/src/scripts/10-脚本按钮.js', 'hub');
  await sleep(300);

  /* 探针：记录「谁在这个窗口上装了捕获阶段的 click 监听」。
     用来证明两件事：① 中转站正常接管时，反截断不会自己再装一份 DOM 兜底（与改前一致）；
     ② 中转站不在时，反截断的兜底确实装上了（脚本能单独分享）。 */
  const CLICK_CAP = [];
  const rawAddEvent = HOST.addEventListener.bind(HOST);
  HOST.addEventListener = function (type, fn, opt) {
    try { if (type === 'click' && (opt === true || (opt && opt.capture))) { CLICK_CAP.push(fn); } } catch (e) { }
    return rawAddEvent(type, fn, opt);
  };

  await loadScript('/src/scripts/20-反截断.js', 'anti');
  await sleep(2600);
  check('中转站正常接管时，反截断不自己装 DOM 兜底（捕获 click 监听 = 0）',
    CLICK_CAP.length === 0, 'CLICK_CAP=' + CLICK_CAP.length);

  /* ---------- 启动阶段 ---------- */
  check('中转站挂上宿主全局 HOST.__hub', !!HOST.__hub);
  check('中转站版本 = 1.3', HOST.__hub && HOST.__hub.version === '1.3', HOST.__hub && HOST.__hub.version);
  check('中转站协议版本 ver = 3（登记格式兼容）', HOST.__hub && HOST.__hub.ver === 3);
  check('中转站不再导出 run/commands（斜杠命令已删）',
    HOST.__hub && HOST.__hub.run === undefined && HOST.__hub.commands === undefined);
  check('登记表里只有「反截断」一个按钮',
    (HOST.__hubDefs || []).length === 1 && HOST.__hubDefs[0].name === '反截断',
    JSON.stringify((HOST.__hubDefs || []).map(d => d.name)));
  check('反截断登记对象里不再声明 commands（斜杠命令已删）',
    HOST.__hubDefs[0].commands === undefined, JSON.stringify(HOST.__hubDefs[0].commands));
  check('酒馆助手里注册的按钮 = ["反截断"]',
    JSON.stringify(HOST.__hub.status().buttons.map(b => b.name)) === '["反截断"]',
    JSON.stringify(HOST.__hub.status().buttons.map(b => b.name)));
  check('QR bar 上渲染出 1 个按钮', labels().length === 1, JSON.stringify(labels()));
  check('按钮初始文案 = 反截断 关（默认关闭）', labels()[0] === '反截断 关', labels()[0]);
  check('反截断让位：自有按钮登记为 visible:false',
    JSON.stringify(STATE.visible.get('anti')) === JSON.stringify([{ name: '反截断', visible: false }]),
    JSON.stringify(STATE.visible.get('anti')));
  check('按钮上打了 data-hub-btn 标记（TAG 拼接 bug 已修）',
    document.querySelector('#qr-bar .qr--button').getAttribute('data-hub-btn') === '反截断',
    document.querySelector('#qr-bar .qr--button').getAttribute('data-hub-btn'));
  check('样式表 #kami-hub-css 已注入且选择器正确',
    !!document.getElementById('kami-hub-css') && document.getElementById('kami-hub-css').textContent.includes('[data-hub-btn]'));
  check('旧样式 id #sfe-hub-css 不存在', !document.getElementById('sfe-hub-css'));

  /* ---------- 前缀匹配：动态标签 ---------- */
  const probe = document.createElement('button');
  probe.className = 'qr--button';
  probe.innerHTML = '<span class="qr--button-label">🎨暗夜紫</span>';
  document.getElementById('qr-bar').appendChild(probe);
  HOST.__hub.register({ name: '🎨', label: () => '🎨暗夜紫', click: () => {} });
  await sleep(1000);
  check('前缀匹配：登记名 🎨 能命中标签「🎨暗夜紫」',
    document.querySelector('#qr-bar .qr--button[data-hub-btn="🎨"]') !== null,
    JSON.stringify(labels()));
  HOST.__hub.unregister('🎨');
  probe.remove();
  await sleep(900);

  /* ---------- 点击（走酒馆助手按钮事件通道） ---------- */
  document.querySelector('#qr-bar .qr--button').click();
  await sleep(1200);
  check('点击后文案变为「反截断 开」', labels()[0] === '反截断 开', labels()[0]);
  check('开关状态写进脚本变量 anti-truncation.enabled',
    FRAMES.anti.w.__scriptVars['anti-truncation'] && FRAMES.anti.w.__scriptVars['anti-truncation'].enabled === true,
    JSON.stringify(FRAMES.anti.w.__scriptVars));

  const ping1 = HOST.__hubDefs[0].ping;
  await sleep(1200);
  check('反截断心跳在刷新（ownSync 定时器活着）', HOST.__hubDefs[0].ping > ping1,
    ping1 + ' -> ' + HOST.__hubDefs[0].ping);
  check('反截断 iframe 内仍有 1 个定时器（ownSync）', FRAMES.anti.w.__timers.size >= 1, FRAMES.anti.w.__timers.size);

  /* ---------- 关闭反截断脚本 ---------- */
  FRAMES.anti.w.dispatchEvent(new FRAMES.anti.w.Event('pagehide'));
  await sleep(700);
  check('反截断注销：删除宿主全局 AntiTruncation', HOST.AntiTruncation === undefined);
  check('反截断注销：定时器全部清空（无残留轮询）', FRAMES.anti.w.__timers.size === 0, FRAMES.anti.w.__timers.size);
  check('反截断注销：从登记表移除',
    (HOST.__hubDefs || []).every(d => d.name !== '反截断'), JSON.stringify((HOST.__hubDefs || []).map(d => d.name)));
  await sleep(1600);
  check('反截断注销后 QR bar 无按钮', labels().length === 0, JSON.stringify(labels()));
  check('反截断注销后按钮表被清空', JSON.stringify(STATE.visible.get('hub') || []) === '[]',
    JSON.stringify(STATE.visible.get('hub')));

  /* ---------- 关闭中转站 ---------- */
  FRAMES.hub.w.dispatchEvent(new FRAMES.hub.w.Event('pagehide'));
  await sleep(600);
  check('中转站注销：删除 HOST.__hub', !HOST.__hub);
  check('中转站注销：移除注入样式 #kami-hub-css', !document.getElementById('kami-hub-css'));
  check('中转站注销：清掉 data-hub-btn 属性',
    document.querySelectorAll('[data-hub-btn]').length === 0,
    document.querySelectorAll('[data-hub-btn]').length);
  check('中转站注销：定时器全部清空', FRAMES.hub.w.__timers.size === 0, FRAMES.hub.w.__timers.size);
  check('中转站注销：按钮事件通道解绑（监听器清零）',
    [...STATE.handlers.entries()].filter(([k, m]) => k.startsWith('button:') && m.size > 0).length === 0,
    JSON.stringify([...STATE.handlers.entries()].map(([k, m]) => k + '=' + m.size)));

  /* ---------- 回归：注销后不能被残留事件唤醒 ---------- */
  HOST.dispatchEvent(new Event('kami-hub-def'));
  await sleep(1400);
  check('注销后派发 kami-hub-def 不会复活按钮', labels().length === 0, JSON.stringify(labels()));
  check('注销后 __hub 不会被重建', !HOST.__hub);

  /* ---------- 回归：重新启动能接管（可反复开关） ---------- */
  await loadScript('/src/scripts/10-脚本按钮.js', 'hub2');
  await sleep(1200);
  check('重新启动中转站后能重新挂上 __hub（v1.3 可反复开关）',
    !!HOST.__hub && HOST.__hub.version === '1.3');

  /* ---------- 回归：按钮串台（名字互为前缀 + 祖先拼接文字） ----------
     背景：老版本的 DOM 兜底通道会从点击目标往上爬 6 层，把每一层的 textContent
     都拿去和登记名做前缀比对。于是 ① 名字互为前缀时点长的会触发短的；
     ② 爬到按钮条容器 .qr--buttons（它的文字是所有按钮文字拼起来的）时，
     点谁都触发排在前面的那个。这里两个毛病一起测。 */
  const row = document.createElement('div');
  row.className = 'qr--buttons';
  document.body.appendChild(row);
  const mkBtn = (text) => {
    const b = document.createElement('div');
    b.className = 'qr--button';
    const l = document.createElement('span');
    l.className = 'qr--button-label';
    l.textContent = text;
    b.appendChild(l);
    row.appendChild(b);
    return b;
  };
  const btnShort = mkBtn('串台A 关');
  const btnLong = mkBtn('串台A长');
  const hits = [];
  const mkDef = (name, order, label) => ({
    name, order, ping: Date.now(), alive: () => true, ready: () => true,
    get: () => 1, label: () => label, click: () => hits.push(name)
  });
  HOST.__hub.register(mkDef('串台A', 5, '串台A 关'));
  HOST.__hub.register(mkDef('串台A长', 6, '串台A长'));
  await sleep(1200);
  const clickOne = (el) => {
    hits.length = 0;
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    return hits.join('+');
  };
  let cap = clickOne(btnLong);
  check('串台回归：点「串台A长」自己的按钮只触发它自己（不被前缀名 串台A 抢走）',
    cap === '串台A长', '实际=' + cap);
  await sleep(450);
  cap = clickOne(btnLong.querySelector('.qr--button-label'));
  check('串台回归：点它的文字层也只触发它自己', cap === '串台A长', '实际=' + cap);
  await sleep(450);
  cap = clickOne(btnShort);
  check('串台回归：点「串台A」自己的按钮只触发它自己', cap === '串台A', '实际=' + cap);
  await sleep(450);
  cap = clickOne(row);
  check('串台回归：点祖先容器（文字=全体按钮拼接「串台A 关串台A长」）不许触发任何按钮',
    cap === '', '实际=' + cap);
  /* 页面别处的第三方按钮：类名像按钮、文字也以登记名开头，但**不在按钮条里** —— 一律不许触发。
     实测案例（2026-09-24）：插图插件 RBQ-Draw 的子插件「智能生图触发器 (Smart Draw)」往聊天页插的
     `<button class="menu_button">🎨 生成</button>`，被皮肤管理的登记名「🎨」抢走（前缀匹配），
     用户点插件的生图按钮却开了皮肤面板。见 .audit/RBQ按钮串台调查.md。 */
  const outsideBtn = document.createElement('button');
  outsideBtn.className = 'menu_button';           /* 第三方按钮的典型类名：含 button → isButtonish 命中 */
  outsideBtn.textContent = '串台A 生成';           /* 文字以登记名开头，正是当年会被抢的形状 */
  document.body.appendChild(outsideBtn);           /* 挂在页面里，**不在** .qr--buttons 里 */
  await sleep(500);
  cap = clickOne(outsideBtn);
  check('串台回归：按钮条外的第三方按钮，文字以登记名开头也不许触发（皮肤管理那次的形状）',
    cap === '', '实际=' + cap);
  outsideBtn.remove();
  await sleep(300);
  check('串台回归：登记名互为前缀要在 status().nameConflicts 里报出来',
    JSON.stringify(HOST.__hub.status().nameConflicts) === JSON.stringify(['串台A ↔ 串台A长']),
    JSON.stringify(HOST.__hub.status().nameConflicts));
  HOST.__hub.unregister('串台A');
  HOST.__hub.unregister('串台A长');
  row.remove();
  await sleep(900);

  /* ---------- 回归：反截断自带的 DOM 兜底（独立模式）不许串台 ----------
     背景：这一份兜底以前也是「往上爬 6 层 + 前缀匹配 + 按顺序取第一个」，
     于是点按钮条容器（它的文字是所有按钮拼起来的）也会触发反截断。
     它和中转站是两份各自独立的实现（反截断要能单独分享），所以两份都得修。
     下面把中转站彻底关掉，让反截断回到「独立模式」，它才会装自己的 DOM 兜底。 */
  FRAMES.hub2.w.dispatchEvent(new FRAMES.hub2.w.Event('pagehide'));
  await sleep(800);
  check('中转站关掉后 __hub 消失（准备测独立模式）', !HOST.__hub);
  const capBefore = CLICK_CAP.length;
  await loadScript('/src/scripts/20-反截断.js', 'anti2');
  await sleep(1600);
  check('独立模式：反截断这才装上自己的 DOM 兜底（捕获 click 监听 +1）',
    CLICK_CAP.length === capBefore + 1, capBefore + ' -> ' + CLICK_CAP.length);
  check('独立模式：反截断接口可用', !!HOST.AntiTruncation);
  const ownBtn = document.querySelector('#qr-bar .qr--button');
  check('独立模式：反截断自带按钮渲染出来了（中转站不在也能用）',
    !!ownBtn && (ownBtn.textContent || '').indexOf('反截断') === 0,
    ownBtn ? ownBtn.textContent : '（没有按钮）');
  const antiOn = () => !!(HOST.AntiTruncation && HOST.AntiTruncation.status().enabled);

  /* 照真酒馆结构搭一个按钮条：.qr--buttons 容器 > .qr--button 宿主 > .qr--button-label 文字 */
  const ownRow = document.createElement('div');
  ownRow.className = 'qr--buttons';
  document.body.appendChild(ownRow);
  const mkOwnBtn = (text) => {
    const b = document.createElement('div');
    b.className = 'qr--button';
    const l = document.createElement('span');
    l.className = 'qr--button-label';
    l.textContent = text;
    b.appendChild(l);
    ownRow.appendChild(b);
    return b;
  };
  const twinBtn = mkOwnBtn('反截断长');      /* 别人家的按钮：名字和「反截断」互为前缀 */
  const otherBtn = mkOwnBtn('别的功能 开');   /* 完全无关的按钮 */
  if (ownBtn) { ownRow.appendChild(ownBtn); } /* 把反截断自己的按钮挪进按钮条 */
  await sleep(1300);
  const capOwn = () => ownBtn.querySelector('.qr--button-label');
  const clickAt = (el) => el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
  let b0 = antiOn();
  clickAt(ownBtn);
  await sleep(500);
  check('兜底回归：点反截断自己的按钮能切换开/关（兜底仍然有效）', antiOn() !== b0,
    b0 + ' -> ' + antiOn());
  b0 = antiOn();
  clickAt(capOwn());
  await sleep(500);
  check('兜底回归：点它的文字层也能切换', antiOn() !== b0, b0 + ' -> ' + antiOn());
  b0 = antiOn();
  clickAt(twinBtn);
  await sleep(500);
  check('兜底回归：点前缀同名的「反截断长」（别人家的按钮）不许触发反截断', antiOn() === b0,
    b0 + ' -> ' + antiOn());
  b0 = antiOn();
  clickAt(otherBtn);
  await sleep(500);
  check('兜底回归：点无关按钮（别的功能 开）不许触发反截断', antiOn() === b0,
    b0 + ' -> ' + antiOn());
  b0 = antiOn();
  clickAt(ownRow);
  await sleep(500);
  check('兜底回归：点祖先容器（文字=全体按钮拼接「反截断 开反截断长别的功能 开」）不许触发',
    antiOn() === b0, b0 + ' -> ' + antiOn());

    code = code.split('/* @@KAMI_PRESET_PARSE@@ */').join(parseInlined);
    const baseCss = await (await fetch('/src/skin/base.css')).text();
    code = code.split('/* @@KAMI_BASE_CSS_JS@@ */').join('var KAMI_BASE_CSS = ' + JSON.stringify(baseCss) + ';');
    w.eval(code);
    FRAMES.preset = { iframe, w };
    await sleep(1200);
    /* 面板是点按钮才建 DOM 的：走按钮条的点击（和真机点 🌟卡密预设 同一条路） */
    const hubBtn = () => [...document.querySelectorAll('#qr-bar .qr--button')]
      .find(b => (b.textContent || '').indexOf('卡密预设') >= 0);
    await sleep(800);
    const hb = hubBtn();
    if (hb) { hb.click(); }
    await sleep(500);
    const panel = document.getElementById('kami-preset-panel');
    check('预设面板：已挂载 #kami-preset-panel', !!panel);
    if (panel) {
      const tabBtns = () => [...panel.querySelectorAll('[data-kami-tab]')];
      const cur = () => panel.querySelector('[data-kami-pane]:not([hidden])');
      const paneKey = () => { const p = cur(); return p ? p.getAttribute('data-kami-pane') : null; };
      const before = paneKey();
      /* 鼠标轻点第一枚 tab（真实事件序列，含 pointer capture 路径） */
      const b = tabBtns()[0];
      b.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'mouse', button: 0, clientX: 0, clientY: 0 }));
      b.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerType: 'mouse', button: 0, clientX: 0, clientY: 0 }));
      b.click();
      await sleep(300);
      check('预设面板（PC 回归）：鼠标点 tab 能切换', paneKey() === b.getAttribute('data-kami-tab'),
        'before=' + before + ' after=' + paneKey() + ' want=' + b.getAttribute('data-kami-tab'));
      /* 点另一枚 tab 也能切 */
      const all = tabBtns();
      if (all.length >= 2) {
        const t2 = all[all.length - 1];
        t2.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'mouse', button: 0, clientX: 1, clientY: 0 }));
        t2.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerType: 'mouse', button: 0, clientX: 1, clientY: 0 }));
        t2.click();
        await sleep(300);
        check('预设面板（PC 回归）：点另一枚 tab 也切换', paneKey() === t2.getAttribute('data-kami-tab'),
          'after=' + paneKey() + ' want=' + t2.getAttribute('data-kami-tab'));
      }
      /* 点 tab 行空白处（容器本身）不许切 */
      const bar = panel.querySelector('[data-kami-role="tabs"]');
      const keep = paneKey();
      if (bar) {
        bar.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'mouse', button: 0, clientX: 0, clientY: 0 }));
        bar.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerType: 'mouse', button: 0, clientX: 0, clientY: 0 }));
        bar.click();
        await sleep(250);
        check('预设面板（PC 回归）：点 tab 行空白不切换', paneKey() === keep,
          keep + ' -> ' + paneKey());
      }
      /* 注释新结构：条目名是标题栏，注释是卡下方独立容器（问题 6） */
      const noteHosts = panel.querySelectorAll('.kami-item-note');
      check('预设面板（注释结构）：有注释的条目外包 .kami-item-note', noteHosts.length > 0,
        'hosts=' + noteHosts.length);
      if (noteHosts.length) {
        const h = noteHosts[0];
        const btn = h.querySelector('button.kami-item');
        const note = h.querySelector('[data-kami-note]');
        const mark = h.querySelector('[data-kami-note-mark]');
        check('预设面板（注释结构）：卡是按钮、注释容器在卡外下方',
          !!btn && !!note && note.parentNode === h && btn.parentNode === h);
        if (mark && note) {
          const wasHidden = note.hasAttribute('hidden');
          mark.click();
          await sleep(150);
          check('预设面板（注释结构）：点ⓘ 展开注释', note.hasAttribute('hidden') === false);
          mark.click();
          await sleep(150);
          check('预设面板（注释结构）：再点ⓘ 收起注释', note.hasAttribute('hidden') === wasHidden);
        }
      }
    }
  }

  report();
})().catch(e => {
  R.push('FAIL  测试脚本自身异常: ' + (e && e.stack || e));
  report();
});
</script>
</body>
</html>
