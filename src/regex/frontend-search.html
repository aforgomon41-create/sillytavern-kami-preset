<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索资料</title>
<style>
/* @@KAMI_BASE_CSS@@ */
html,body{margin:0;padding:0;background:transparent;border:0}
.kami-root[data-kami-search]{position:relative}
.kami-root[data-kami-search] .kami-md a{overflow-wrap:anywhere}
.kami-root[data-kami-search] .kami-card-note{white-space:normal;overflow-wrap:anywhere}
</style>
</head>
<body>
<!-- 不把捕获到的 JSON 拼进 HTML；从本 iframe 对应的楼层读取原始数据。 -->
<div class="kami-root" data-kami-comp="search" data-kami-search="1" data-kami-container="embedded">
  <div class="kami-shell kami-surface kami-collapse" data-kami-open="0">
    <div class="kami-head kami-collapse-head" role="button" tabindex="0" aria-expanded="false" aria-controls="search-body">
      <span class="kami-dot" aria-hidden="true"></span>
      <span class="kami-deco" data-kami-deco="d20" aria-hidden="true"></span>
      <span class="kami-title">搜索资料</span>
      <span class="kami-badge" data-kami-kind="info" data-search-origin hidden></span>
      <span class="kami-actions">
        <span class="kami-sub" data-search-count>读取中</span>
        <span class="kami-chev" aria-hidden="true">▸</span>
      </span>
    </div>
    <div id="search-body" class="kami-body kami-collapse-body">
      <p class="kami-card-note" data-search-scope hidden></p>
      <ol class="kami-facts" data-search-facts></ol>
      <div class="kami-src-box" data-search-sources hidden>
        <span class="kami-sub kami-src-label">来源</span>
        <ol class="kami-src-list" data-search-source-list></ol>
      </div>
      <p class="kami-card-note" data-search-empty hidden></p>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  /* @@KAMI_UI@@ */
  /* @@KAMI_SEARCH_PURE@@ */
  var doc=document,ui=createKamiUi(doc);
  var root=ui.adopt(doc.querySelector('[data-kami-search]'));
  var shell=root.querySelector('.kami-collapse'),head=root.querySelector('.kami-collapse-head');
  var countEl=root.querySelector('[data-search-count]');
  var originEl=root.querySelector('[data-search-origin]');
  var scopeEl=root.querySelector('[data-search-scope]');
  var factsEl=root.querySelector('[data-search-facts]');
  var srcBox=root.querySelector('[data-search-sources]');
  var srcList=root.querySelector('[data-search-source-list]');
  var emptyEl=root.querySelector('[data-search-empty]');
  var disposed=false,retry=null;

  function make(tag,className,text){var node=ui.element(tag);if(className){node.className=className;}if(text!==undefined){node.textContent=text;}return node;}
  function hide(node,state){if(node){if(state){node.setAttribute('hidden','');}else{node.removeAttribute('hidden');}}}
  function find(name){var target=window;for(var i=0;i<8;i++){try{if(typeof target[name]==='function'){return target[name].bind(target);}if(target.TavernHelper&&typeof target.TavernHelper[name]==='function'){return target.TavernHelper[name].bind(target.TavernHelper);}if(!target.parent||target.parent===target){break;}target=target.parent;}catch(e){break;}}return null;}
  function toggle(){var open=shell.getAttribute('data-kami-open')!=='1';shell.setAttribute('data-kami-open',open?'1':'0');head.setAttribute('aria-expanded',open?'true':'false');}
  head.addEventListener('click',toggle);
  head.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===' '||event.key==='Spacebar'){event.preventDefault();toggle();}});

  /* 来源小标签：编号 + 标题（标题拿不到就用主机名，解析层已经兜过底） */
  function sourceChip(source,index){
    var chip=make('a','kami-src');
    chip.href=source.url;
    chip.target='_blank';
    chip.rel='noopener noreferrer';
    chip.setAttribute('title',source.url);
    chip.appendChild(make('span','kami-src-n',String(index)));
    chip.appendChild(make('span','kami-src-title',source.title||source.url));
    return chip;
  }

  function show(records){
    factsEl.textContent='';
    srcList.textContent='';
    var factTotal=0,merged=Object.create(null),order=[],indexOf=Object.create(null);
    /* 先把所有记录的来源合并成一张表：事实里的 [n] 要对应下面来源表的编号，
       所以必须先算完编号再渲染事实。 */
    records.forEach(function(record){
      (Array.isArray(record.sources)?record.sources:[]).forEach(function(value){
        var source=webSearchSource(value);
        if(!source||!source.id){return;}
        if(!merged[source.id]){merged[source.id]=source;order.push(source.id);indexOf[source.id]=order.length;}
      });
    });
    records.forEach(function(record){
      if(record.world||record.scope){
        scopeEl.textContent=[record.world,record.scope].filter(Boolean).join(' · ');
        hide(scopeEl,false);
      }
      originEl.textContent=record.origin==='native'?'模型原生':'服务检索';
      hide(originEl,false);
      var localMap=Object.create(null);
      (Array.isArray(record.sources)?record.sources:[]).forEach(function(value){
        var source=webSearchSource(value);
        if(source&&source.id&&indexOf[source.id]){localMap[source.id]=source;}
      });
      (record.facts||[]).forEach(function(fact){
        if(!fact||typeof fact.text!=='string'){return;}
        factTotal++;
        var row=make('li','kami-fact');
        row.appendChild(make('span','kami-fact-n',String(factTotal)));
        var text=make('span','kami-fact-text',fact.text);
        /* 来源标记放进正文里（不是并列的第三个格子）：外层是两列网格，
           多一个子元素会被挤到下一行去。 */
        var ids=(Array.isArray(fact.source_ids)?fact.source_ids:[]).filter(function(id,i,list){return localMap[id]&&list.indexOf(id)===i;});
        if(ids.length){
          var marks=make('span','kami-fact-src');
          ids.forEach(function(id){
            var source=localMap[id];
            var mark=make('a','kami-src-mark','['+indexOf[id]+']');
            mark.href=source.url;
            mark.target='_blank';
            mark.rel='noopener noreferrer';
            mark.setAttribute('title',source.title+' · '+source.url);
            marks.appendChild(mark);
          });
          text.appendChild(marks);
        }
        row.appendChild(text);
        factsEl.appendChild(row);
        if(typeof fact.note==='string'&&fact.note){factsEl.appendChild(make('li','kami-fact-note kami-card-note',fact.note));}
      });
      if(!(record.facts||[]).length){
        var reason=record.status==='not_found'?'本次没有找到可用资料。':record.status==='budget_exceeded'?'资料超过本轮长度预算，未加入新事实。':'本次没有需要补充的新事实。';
        hide(emptyEl,false);emptyEl.textContent=reason;
      }
    });
    order.forEach(function(id,i){srcList.appendChild(sourceChip(merged[id],i+1));});
    hide(srcBox,order.length===0);
    countEl.textContent=factTotal+' 条';
    root.setAttribute('data-search-ready','1');
    root.setAttribute('data-search-sources',String(order.length));
  }

  async function boot(attempt){
    if(disposed){return;}
    var current=find('getCurrentMessageId'),messages=find('getChatMessages');
    if(!current||!messages){if(attempt<8){retry=setTimeout(function(){boot(attempt+1);},50);return;}countEl.textContent='未能读取';hide(emptyEl,false);emptyEl.textContent='无法读取本楼的搜索资料。';return;}
    try{
      var id=await current();
      if(!Number.isInteger(Number(id))||Number(id)<0){throw Error('Invalid message');}
      var rows=await messages(String(id));
      if(disposed){return;}
      var row=rows&&rows[0];
      var records=readWebSearchRecords(row&&(row.message!==undefined?row.message:row.mes));
      if(!records.length){throw Error('Invalid record');}
      show(records);
    }catch(e){
      if(!disposed){countEl.textContent='格式不完整';hide(emptyEl,false);emptyEl.textContent='本楼的搜索资料尚不完整，可在消息编辑中核对。';}
    }
  }
  window.addEventListener('pagehide',function(){disposed=true;if(retry!==null){clearTimeout(retry);}});
  boot(0);
})();
</script>
</body>
</html>
