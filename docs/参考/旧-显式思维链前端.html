          root.style.setProperty('--sfe-font', cs.fontFamily);
        }
      }
    } catch (e) { }

  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function trim(s) {
    return String(s || '').replace(/^\s+/, '').replace(/\s+$/, '');
  }

  function repeatChar(ch, n) {
    var r = '';
    for (var i = 0; i < n; i++) { r += ch; }
    return r;
  }

  /* 纯文本段的行内格式（不含代码） */
  function fmt(s) {
    s = esc(s);
    s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, function (m, t, u) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + t + '</a>'; });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, function (m, c) { return '<strong>' + c + '</strong>'; });
    s = s.replace(/__([^_\n]+)__/g, function (m, c) { return '<strong>' + c + '</strong>'; });
    s = s.replace(/\*([^*\n]+)\*/g, function (m, c) { return '<em>' + c + '</em>'; });
    s = s.replace(/(^|[^A-Za-z0-9_])_([^_\n]+)_(?![A-Za-z0-9_])/g, function (m, p, c) { return p + '<em>' + c + '</em>'; });
    s = s.replace(/~~([^~\n]+)~~/g, function (m, c) { return '<del>' + c + '</del>'; });
    return s;
  }

  /* 行内格式（扫描器实现，反引号内容永远可见） */
  function inline(s) {
    s = String(s);
    var out = '';
    var i = 0;
    var n = s.length;
    while (i < n) {
      if (s.charAt(i) === '`') {
        var t = 0;
        while (i + t < n && s.charAt(i + t) === '`') { t++; }
        var close = s.indexOf(repeatChar('`', t), i + t);
        var code = close > -1 ? s.slice(i + t, close) : '';
        if (close > -1 && code.length > 0) {
          out += '<code>' + esc(code) + '</code>';
          i = close + t;
          continue;
        }
        out += repeatChar('`', t);
        i += t;
        continue;
      }
      var j = i;
      while (j < n && s.charAt(j) !== '`') { j++; }
      out += fmt(s.slice(i, j));
      i = j;
    }
    return out;
  }

  /* 缩进宽度：Tab=4，全角空格=2，半角空格=1 */
  function indw(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (c === '\t') { w += 4; }
      else if (c === '\u3000') { w += 2; }
      else if (c === ' ') { w += 1; }
      else { break; }
    }
    return w;
  }

  /* 解析单行列表项（无序/有序、任意缩进） */
  function parseItem(line) {
    var m = /^([ \t\u3000]*)([-*+•·])\s+(.*)$/.exec(line);
    if (m) { return { ind: indw(m[1]), type: 'ul', lines: [m[3]] }; }
    m = /^([ \t\u3000]*)(\d{1,3})\s*([、)）])\s*(.+)$/.exec(line);
    if (m) { return { ind: indw(m[1]), type: 'ol', lines: [m[4]] }; }
    m = /^([ \t\u3000]*)(\d{1,3})[.．]\s+(.+)$/.exec(line);
    if (m) { return { ind: indw(m[1]), type: 'ol', lines: [m[3]] }; }
    m = /^([ \t\u3000]*)[（(](\d{1,3})[)）]\s*(.+)$/.exec(line);
    if (m) { return { ind: indw(m[1]), type: 'ol', lines: [m[3]] }; }
    return null;
  }

  /* 按缩进构建列表树 */
  function buildTree(items) {
    var root = { ind: -1, children: [] };
    var stack = [root];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      while (stack.length > 1 && stack[stack.length - 1].ind >= it.ind) { stack.pop(); }
      var node = { ind: it.ind, type: it.type, lines: it.lines, children: [] };
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    }
    return root;
  }

  /* 递归渲染嵌套 ul/ol */
  function renderTree(node) {
    var html = '';
    var ch = node.children;
    var i = 0;
    while (i < ch.length) {
      var type = ch[i].type;
      var group = [];
      while (i < ch.length && ch[i].type === type) { group.push(ch[i]); i++; }
      html += '<' + type + '>';
      for (var j = 0; j < group.length; j++) {
        var g = group[j];
        var txt = '';
        for (var k = 0; k < g.lines.length; k++) {
          if (k) { txt += '<br>'; }
          txt += inline(g.lines[k]);
        }
        html += '<li>' + txt + renderTree(g) + '</li>';
      }
      html += '</' + type + '>';
    }
    return html;
  }

  /* 逐行 Markdown 状态机 */
  function md(src) {
    src = String(src || '').replace(/\r\n?/g, '\n');
    var L = src.split('\n');
    var out = [];
    var para = [];
    var i = 0;
    function flush() {
      if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; }
    }
    while (i < L.length) {
      var raw = L[i];
      var t = raw.trim();
      if (!t) { flush(); i++; continue; }
      if (/^([-*_])(\s*\1){2,}$/.test(t)) { flush(); out.push('<hr>'); i++; continue; }
      var hm = /^(#{1,6})\s*(.+)$/.exec(t);
      if (hm) { flush(); out.push('<h' + hm[1].length + '>' + inline(hm[2]) + '</h' + hm[1].length + '>'); i++; continue; }
      if (/^>/.test(t)) {
        flush();
        var q = [];
        while (i < L.length && /^\s*>/.test(L[i])) { q.push(inline(L[i].replace(/^\s*>\s?/, ''))); i++; }
        out.push('<blockquote>' + q.join('<br>') + '</blockquote>');
        continue;
      }
      var item0 = parseItem(raw);
      if (item0) {
        flush();
        var items = [];
        var last = null;
        while (i < L.length) {
          var cur = L[i];
          var it = parseItem(cur);
          if (it) {
            items.push(it);
            last = it;
            i++;
            continue;
          }
          if (!cur.trim()) {
            var k = i + 1;
            while (k < L.length && !L[k].trim()) { k++; }
            if (k < L.length && parseItem(L[k])) { i = k; continue; }
            break;
          }
          if (last && /^[ \t\u3000]/.test(cur)) {
            last.lines.push(cur.trim());
            i++;
            continue;
          }
          break;
        }
        out.push(renderTree(buildTree(items)));
        continue;
      }
      para.push(inline(raw.replace(/[ \t]+$/, '')));
      i++;
    }
    flush();
    return out.join('');
  }

  function fitHeight() {
    try {
      var fe = window.frameElement;
      if (!fe) { return; }
      var h = 0;
      if (document.body) { h = Math.max(h, document.body.scrollHeight); }
      if (document.documentElement) { h = Math.max(h, document.documentElement.scrollHeight); }
      if (h > 0) { fe.style.height = (h + 2) + 'px'; }
    } catch (e) { }
  }

  function setOpen(root, open, silent) {
    open = !!open;
    root.setAttribute('data-tc-open', open ? '1' : '0');
    var body = root.querySelector('.tc-body');
    if (body) { body.hidden = !open; }
    if (!silent) { storeSet(OPEN_KEY, open ? '1' : '0'); }
    fitHeight();
    window.setTimeout(fitHeight, 80);
    window.setTimeout(fitHeight, 260);
  }

  function setMode(root, mode) {
    mode = mode === 'raw' ? 'raw' : 'render';
    var btns = root.querySelectorAll('.tc-mode');
    for (var i = 0; i < btns.length; i++) {
      var m = btns[i].getAttribute('data-tc-mode');
      if (m === mode) { btns[i].classList.add('is-on'); } else { btns[i].classList.remove('is-on'); }
    }
    var r = root.querySelector('.tc-render');
    var w = root.querySelector('.tc-raw');
    if (r) { r.hidden = mode !== 'render'; }
    if (w) { w.hidden = mode !== 'raw'; }
    fitHeight();
    window.setTimeout(fitHeight, 80);
  }

  function boot(root) {
    try { adoptTheme(root); } catch (e) { }

    var holder = root.querySelector('.tc-md');
    var raw = holder ? trim(holder.textContent) : '';

    var meta = root.querySelector('.tc-hl-n');
    if (meta) { meta.textContent = raw.replace(/\s/g, '').length + ' 字'; }

    var render = root.querySelector('.tc-render');
    if (render) {
      if (!raw || raw === PLACEHOLDER) {
        render.innerHTML = '<p class="tc-empty">（未捕获到思维链内容：请检查正则捕获组是否正确传入）</p>';
      } else {
        try { render.innerHTML = md(raw); } catch (e) { render.textContent = raw; }
      }
    }
    var rawEl = root.querySelector('.tc-raw');
    if (rawEl) { rawEl.textContent = raw; }

    var head = root.querySelector('.tc-head');
    if (head) {
      head.addEventListener('click', function () {
        setOpen(root, root.getAttribute('data-tc-open') !== '1', false);
      });
    }
    var btns = root.querySelectorAll('.tc-mode');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (ev) {
        try { ev.stopPropagation(); } catch (e) { }
        setMode(root, this.getAttribute('data-tc-mode'));
      });
    }

    setMode(root, 'render');
    setOpen(root, storeGet(OPEN_KEY) === '1', true);
  }

  function bootAll() {
    var wraps = document.querySelectorAll('.tc-wrap');
    for (var i = 0; i < wraps.length; i++) {
      var w = wraps[i];
      if (w.getAttribute('data-tc-ready') === '1') { continue; }
      w.setAttribute('data-tc-ready', '1');
      try { boot(w); } catch (e) { if (window.console && console.warn) { console.warn('[think-chain]', e); } }
    }
    fitHeight();
  }

  bootAll();
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', bootAll); }
  window.addEventListener('load', fitHeight);
  window.setTimeout(bootAll, 450);
  if (window.ResizeObserver) {
    try {
      var ro = new ResizeObserver(function () { fitHeight(); });
      if (document.body) { ro.observe(document.body); }
    } catch (e) { }
  }
})();
