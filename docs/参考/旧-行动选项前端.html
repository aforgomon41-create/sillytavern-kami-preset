      if (demo) {
        note.hidden = false;
        note.textContent = '未检测到行动选项数据：没有解析到有效的选项 JSON，以下为示例内容（点击不会发送）。请检查正则替换是否已正确捕获并传入 JSON。';
      } else {
        note.hidden = true;
        note.textContent = '';
      }
    }
  }

  /* ========== 双模式动作 ========== */

  function doFill(root, btn, text) {
    var found = findInput();
    if (!found) { toast(root, '未找到酒馆输入框', true); return; }
    var el = found.el;
    var cur = rtrim(String(el.value || ''));
    el.value = cur ? cur + '\n' + text : text;
    fireInput(el);
    try {
      el.focus();
      if (typeof el.selectionStart === 'number') {
        el.selectionStart = el.value.length;
        el.selectionEnd = el.value.length;
      }
      el.scrollTop = el.scrollHeight;
    } catch (e) { }
    markDone(root, btn);
    toast(root, '已填入输入框');
  }

  function apiSend(root, text, el) {
    var create = findFn('createChatMessages');
    var slash = findFn('triggerSlash');
    if (create && slash) {
      if (el) { el.value = ''; fireInput(el); }
      try {
        Promise.resolve(create([{ role: 'user', content: text }]))
          .then(function () { return slash('/trigger'); })
          .catch(function () { toast(root, '发送失败，请手动发送', true); });
      } catch (e) { toast(root, '发送失败，请手动发送', true); }
      return;
    }
    if (slash) {
      try { slash('/send ' + text.split('|').join('｜')); toast(root, '已发送'); }
      catch (e) { toast(root, '发送失败，请手动发送', true); }
      return;
    }
    toast(root, '找不到可用的发送接口', true);
  }

  function doSend(root, btn, text) {
    var found = findInput();
    var el = found ? found.el : null;
    var draft = el ? rtrim(String(el.value || '')) : '';
    var payload = draft ? draft + '\n' + text : text;

    if (el) {
      el.value = payload;
      fireInput(el);
      var sbtn = el.ownerDocument.getElementById('send_but');
      var fired = false;
      if (sbtn) { try { sbtn.click(); fired = true; } catch (e) { } }
      if (!fired) { pressEnter(el); }
      markDone(root, btn);
      toast(root, '已发送');
      window.setTimeout(function () {
        if (rtrim(String(el.value || '')) !== '') { apiSend(root, payload, el); }
      }, 320);
      return;
    }
    apiSend(root, payload, null);
  }

  function onPick(root, btn, text, demo) {
    if (demo) { toast(root, '示例数据不可发送', true); return; }
    var mode = root.getAttribute('data-ao-mode') === 'send' ? 'send' : 'fill';
    if (mode === 'send') { doSend(root, btn, text); } else { doFill(root, btn, text); }
  }

  /* ========== 启动 ========== */

  function boot(root) {
    try { adoptTheme(root); } catch (e) { }

    var holder = root.querySelector('.ao-json');
    var raw = holder ? String(holder.textContent || '').trim() : '';
    var list = null;
    var demo = false;

    if (!raw || raw === PLACEHOLDER) {
      demo = true;
    } else {
      list = parseList(raw);
      if (!list || !list.length) { demo = true; }
    }
    if (demo) { list = SAMPLE; }

    setMode(root, storeGet(MODE_KEY) === 'send' ? 'send' : 'fill', true);
    renderList(root, list, demo);
    bindModes(root);
  }

  function bootAll() {
    var wraps = document.querySelectorAll('.ao-wrap');
    for (var i = 0; i < wraps.length; i++) {
      var w = wraps[i];
      if (w.getAttribute('data-ao-ready') === '1') { continue; }
      w.setAttribute('data-ao-ready', '1');
      try { boot(w); } catch (e) { if (window.console && console.warn) { console.warn('[action-options]', e); } }
    }
  }

  bootAll();
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', bootAll); }
  window.setTimeout(bootAll, 450);
})();
</script>
