<!DOCTYPE html>
<!-- d20 参照审查：同一大图检查台骨架，几何换成 d20 —— 验证环境渲染正确性 -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #141019; color: #ddd; font: 13px monospace; padding: 12px 16px; }
  .kit { position: relative; width: 300px; height: 300px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
  .cell { width: 300px; }
  .cap { margin: 4px 0; }
</style>
<script src="/src/decor/d20.js"></script>
</head>
<body>
<h3>d20 参照（渲染管线是已知的正确底板）—— 每格把一个面正对镜头</h3>
<div class="row" id="row"></div>
<script>
const row = document.getElementById('row');
function slot(v) {
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = '<div class="cap">面 ' + v + '</div>';
  const el = document.createElement('span');
  el.className = 'kami-deco'; el.setAttribute('data-kami-deco', 'd20');
  el.setAttribute('aria-hidden', 'true');
  el.style.cssText = 'position:relative;display:inline-block;width:280px;height:280px;';
  const box = document.createElement('div'); box.className = 'kit';
  box.appendChild(el); cell.appendChild(box); row.appendChild(cell);
  return el;
}
const els = [];
for (let v = 1; v <= 6; v++) els.push(slot(v));
function boot() {
  window.KamiD20.mount(document);
  els.forEach(function (el, i) {
    const v = (i + 1) * 3 + 1;                     // 面已成 20 面：取 3 个不同朝向的取样值
    const faces = el.querySelectorAll('.kami-d20-face');
    const colors = ['#c0392b', '#e67e22', '#f1c40f', '#27ae60', '#16a085', '#2980b9', '#8e44ad', '#d35400', '#7f8c8d', '#2c3e50'];
    faces.forEach(function (f, k) { f.style.background = colors[k % 10]; const inner = f.firstElementChild; if (inner) { inner.style.clipPath = 'none'; inner.style.background = 'transparent'; inner.style.color = '#fff'; } });
    window.KamiD20.roll(el, v);
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
</html>
