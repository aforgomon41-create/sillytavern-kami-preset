# ==============================================================================
# 卡密预设 · MVU 全能变量体系规范 (最终汇总版)
# 规则约定：键名统一为 1-2 个英文字词；实体均使用唯一 ID 作为主键；下划线前缀代表模型只读。
# ==============================================================================

# 1. 镜头与时空环境 (必开常驻)
status:
  round: 1 # 交互轮次，整数计数器
  time: "第四纪元-2023年-11月-15日-15:00" # 剧情历法时间：纪元-年-月-日-时间
  # 地理位置：与地图模块解耦。
  # - 地图模块开启时：填入实体ID结构对象 (realm / area / spot)
  # - 地图模块关闭时：直接填单行自然语言字符串，例如："迷雾森林·石碑遗迹"
  location:
    realm: "realm_forest" # 大区域ID (未开启地图时不填id，直接填字符串)
    area: "area_woods_entry" # 区域ID
    spot: "spot_ancient_altar" # 地点ID
  weather: "浓雾" # 限定枚举：晴/雨/阴/雪/雾/大风/雷暴/暴雨/沙暴/瘴气/异象
  present_chars: ["char_player", "char_heroine"] # 同屏在场角色的ID列表

# 2. 角色实体网络 (以角色ID为主键，支持改名)
characters:
  char_id:
    # ── 基础组 ──
    is_user: true # 是否玩家操作的主角
    name: "雷恩"
    alias: "灰狼" # 可选项
    role: "user" # 限定：user(用户角色) / core(核心角色) / major(主要配角) / minor(次要配角)，龙套禁止建实体
    age: "24" # 支持自然语言描述(某些角色可能年龄不确定)，但优先整数
    identities: ["流浪游侠", "前骑士团见习生"] # 身份标签列表
    location: "spot_ancient_altar" # 可选：当前所在地。地图开启时填spot_id，未开启时填自然语言字符串
    health: "轻度疲惫，左臂有划伤" # 生理伤病自然语言描述
    summary: "因家族变故离开王都的落魄骑士，性格谨慎寡言" # 简要背景人设
    appearance: "黑色碎发，身着磨损皮甲，眼神锐利" # 外貌特征摘要

    # ── 驱动力组 ──
    goals:
      long_term: "查清当年骑士团覆灭的真相" # 远期宏观夙愿
      short_term: "在天黑前穿过迷雾森林" # 近期行动动机
    thoughts: "那个少女手里拿着的徽记，我一定在哪里见过" # 当前即时心声想法
    plan: ["前往旧哨塔休整", "向守林人打听近道"] # 当前待办规划清单

    # ── 社交组 ──
    relations:
      target_char_id:
        affinity: 15 # 好感度，范围 -100 到 100，单次变动上限 +-10
        ties: ["同路旅伴", "潜在雇主"] # 关系身份标签
        impression: "警惕且机敏，但似乎隐瞒了真实目的" # 主观评价
        promise: "承诺安全护送其穿过密林" # 双方约定
        key_event: "在林地边缘合力击退野狼" # 关系关键转折事件

    # ── RPG能力组 ──
    rank: "三阶初段" # 世界观战力等级定位
    stats: # 属性数值系统 (FU / DND / WOD / FATE 四套规则在预设中四选一)
      # 模式 1: FU 最终物语 (四维骰子面数值)
      fu:
        might: 8 # 力量
        agility: 10 # 敏捷
        insight: 6 # 洞察
        willpower: 8 # 意志

      # 模式 2: DND 跑团六维 (常规范围 1-20)
      dnd:
        str: 14 # 力量
        dex: 16 # 敏捷
        con: 13 # 体质
        int: 12 # 智力
        wis: 15 # 感知
        cha: 10 # 魅力

      # 模式 3: WOD 黑暗世界九宫格 (常规范围 1-5 点)
      wod:
        # 生理系
        str: 2 # 力量
        dex: 4 # 敏捷
        sta: 3 # 耐力
        # 心智系
        int: 3 # 智力
        wits: 4 # 感知/机智
        res: 3 # 决心
        # 互动系
        pre: 3 # 风度
        man: 2 # 操控
        com: 4 # 沉着

      # 模式 4: FATE 命运阶梯 (档位字母: F/F+/E/E+/D/D+/C/C+/B/B+/A/A+/S/S+/EX)
      fate:
        # 肉体与战斗
        physique: "B" # 体格
        athletics: "A" # 运动
        melee: "B+" # 近战
        shoot: "C" # 射击
        # 感知与社交
        notice: "A" # 察觉
        empathy: "C+" # 共情
        rapport: "D" # 交际
        deceive: "E" # 欺诈
        provoke: "C" # 挑衅
        contacts: "D" # 人脉
        # 智慧与技术
        investigate: "B" # 调查
        lore: "C" # 学识
        crafts: "E" # 工艺
        burglary: "D" # 盗窃
        stealth: "A" # 潜行
        drive: "F" # 驾驶
        resources: "E+" # 财富
        will: "A" # 意志

    special_stats: # 可选：世界观专有能量槽或机制数值
      tag_name: "自然语言描述"
    skills: # 主动能力
      连珠射击: "瞬间搭上两支箭连续射击，命中附带穿刺"
    traits: # 被动特性
      林地行者: "在丛林移动不受减速惩罚，潜行判定具备优势"

    # ── 资产与随身装备 ──
    items:
      item_id:
        name: "精钢猎弓"
        count: 1
        type: "equip" # 限定：equip(装备) / prop(道具) / consume(消耗) / key(关键) / misc(杂物)
        desc: "一把做工扎实的猎弓，弓臂略有磨损" # 玩家表面可见描述
        real_desc: "弓把暗槽内刻有古代工匠暗纹" # 仅记录与表面存在反差的信息，可选项
        equipped: true # 是否佩戴装备
    wealth:  # 世界观货币，格式为货币名: num或等价物名: "str"
      金币: 12
      银币: 45
    mount: # 可选：坐骑与载具
      mount_id:
        name: "杂色驽马"
        type: "mount" # mount(坐骑) / vehicle(载具) / armor(装甲)
        desc: "体格健壮耐力较好的山地马"
        real_desc: ""
        status: "健康良好"
        equipped: true # 是否当前骑乘

    # ── NSFW组 (可选大开关) ──
    nsfw:
      libido: "克制但敏锐" # 固有欲望倾向
      exp: "略有经历" # 过往经历描述
      kinks: ["轻度控制", "耳语"] # 已觉醒性癖列表
      latent_kinks: ["公开羞耻"] # 未觉醒隐藏性癖列表
      lust: 20 # 当前情欲数值，0-200。>100触发高潮，满200虚脱重置
      body:
        ear:
          desc: "轮廓分明，耳尖微薄"
          dev: "轻度开发，受到热气会明显泛红" # 开发度，纯自然语言描述
          sens: "weakspot" # 敏感度：dull(迟钝) / normal(普通) / sens(敏感) / weakspot(弱点)
          status: "微热紧绷" # 即时生理状态

# 3. 地图模块 · 节点拓扑模式 (大区 -> 区域 -> 地点，三级结构)
map_nodes:
  realm_id:
    name: "迷雾森林大区"
    is_found: true # 探索标记：玩家是否已知晓该大区
    desc: "终年笼罩在白雾中的广袤林海"
    real_desc: "地底埋藏着上古文明的能量节点"
    bg_image: "forest_bg.webp" # 可选：联动前端背景图
    bgm: "fog_ambient.mp3" # 可选：联动前端环境音
    areas:
      area_id:
        name: "林缘哨所区"
        is_found: true
        desc: "旧王国遗留的边境巡逻道"
        real_desc: ""
        bg_image: ""
        bgm: ""
        connections: ["area_ruins", "area_lake"] # 连通的同级区域ID列表
        spots:
          spot_id:
            name: "石碑遗迹"
            is_found: true
            desc: "矗立在三岔路口的古老石碑"
            real_desc: "石碑背面有新刻的盗贼密语"
            bg_image: ""
            bgm: ""

# 4. 势力组织模块 (可选大开关)
factions:
  faction_id:
    name: "晨曦骑士团"
    alias: "白鸦教团" # 可选
    type: "宗教军事武装" # 势力性质
    leader: "char_grand_master" # 关联领袖的角色ID，可选项
    summary: "崇奉旧日烈阳的军修组织，对异端极度严苛"
    domain: "控制圣城周边及北方三大要塞" # 自然语言控制范围
    goals:
      long_term: "净化边境异象并收复旧圣堂"
      short_term: "封锁迷雾森林的外围主干道"
    plan: ["向石碑哨所增派骑兵小队", "搜捕失窃的圣印"]
    rep:
      char_player:
        value: -20 # 声望数值，范围 -100 到 100
        title: "受审嫌疑人" # 声望头衔称号
        key_event: "曾拒绝接受教团的强制搜身"
    diplomacy:
      target_faction_id:
        relation: "敌对交战" # 外交关系
        trends: "正集结重装卫队准备围攻其地下据点" # 近期战略动向

# 5. 剧情线模块 · 主观手账日志 (可选大开关，记录心路与历史节点)
storylines:
  line_id:
    title: "圣印窃案的真相" # 剧情暗线名称
    priority: "main" # main(主线) / side(重要支线) / personal(个人心结)
    summary: "骑士团丢失的圣印似乎不是被盗，更像是一场内外勾结的监守自盗" # 主观总体推测
    nodes:
      - round: 12 # 交互轮次
        time: "第四纪元-2023年-11月-15日-15:00" # 剧情实际历法时间
        title: "血色回廊的遭遇"
        log: "在地下水道发现了带有教团密印的匕首。刺客临死前念叨的名字绝非外人，这件事水很深。" # 主观记录
        chars: ["char_assassin", "char_priest"] # 涉及角色ID列表

# 6. 任务模块 · 客观执行清单 (可选大开关)
quests:
  quest_id:
    name: "遗迹的侦察委托"
    client: "char_heroine" # 委托人ID (角色/势力模块未开启时填自然语言名字)
    line_id: "line_holy_relic" # 关联剧情线ID (剧情线模块未开启时为 null)
    type: "赏金委托" # 主线使命 / 赏金委托 / 阵营征召 / 突发机缘
    objective: "前往迷雾森林深处的古老石碑，拓印表面的符文" # 当前阶段目标
    limits: "必须在入夜迷雾加深前返回" # 可选限制条件
    status: "active" # pending(未接取) / active(进行中) / done(已达成) / failed(已失败)
    reward: "金币 50 与内城通行文书" # 报酬一句话自然语言
    secret: "雇主想借助符文破译开启深层封印，拓印过程会触发警戒陷阱" # 隐藏暗线，前端对玩家过滤不显示

# 7. 独立不动产模块 (可选大开关)
estates:
  estate_id:
    name: "林间废弃猎人小屋"
    type: "避难据点" # 住宅 / 据点 / 商铺 / 要塞 / 庄园 / 工坊
    owner: "char_player" # 归属角色ID、势力ID或"public"
    spot_id: "spot_hunter_cabin" # 关联地点ID (地图模块未开启时直接填自然语言位置，如："迷雾森林深处")
    is_found: true
    desc: "一间用原木搭建的单层木屋，带有倾斜的阁楼"
    real_desc: "地下藏有一个通风良好的储藏地窖"
    facilities:
      工作台: "简陋修补工具，可维护武器防具"
      炉灶: "可烹饪基础热食"
    residents: ["char_player"] # 常驻留守角色ID列表

# 8. 设定集模块 (可选大开关，沉淀剧情中揭晓的法则与概念)
lore:
  lore_id:
    title: "深渊瘴气侵蚀机制"
    category: "世界法则" # 世界法则 / 种族文化 / 魔法科技 / 历史事件 / 宗教信仰 / 禁忌秘闻
    is_found: true # 玩家是否已知悉该设定
    summary: "吸入迷雾中的深渊瘴气会导致理智下降，并在体表产生结晶异变" # 公开机制两句话简述
    truth: "瘴气并非自然天灾，而是远古神明残骸泄露的能量波动" # 核心黑幕内幕，可选项

