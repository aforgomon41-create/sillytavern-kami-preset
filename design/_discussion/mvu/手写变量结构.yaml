当前状态:
  轮次:
  时间: # 格式为纪元-年-月-日-时间
  位置:
    区域:
    地点:
    坐标: # 仅网格地图模式开启
  天气: # 仅可为：晴/雨/阴/雪/雾/大风/雷暴/暴雨/沙暴/瘴气/异象
  在场角色: # 数组，记录同屏角色的唯一角色ID

# 角色组
角色:
  角色ID:
    # 基础组
    is_user:
    姓名:
    别称: # 可选项
    定位: # 该角色在剧情里的定位，仅可为: 用户角色/核心角色/主要配角/次要配角，路人/龙套不允许创建角色实体
    年龄:
    身份: # 数组，记录角色的身份标签
    健康: 
    概括: # 大致记录角色背景故事/人设
    外貌:
    # 驱动力组
    目标:
      远期:
      近期:
    想法: # 角色当前的内心想法
    规划: # 简单的任务列表，如同agent的todo清单一样
    # 社交组
    社交:
      角色ID:
        好感度: # -100到100，每次变动上限+-10
        关系: # 数组，关系标签
        印象:
        约定:
        关键事件: # 对于两人关系来说非常重要的事件
    # RPG组
    位阶: # 表示角色在世界观里的实力等级
    属性: # 从FU/DND/WOD/FATE四种种类型中选择
      # FU 最终物语
      力量:
      敏捷:
      洞察:
      意志:
      # DND
      力量:
      敏捷:
      体质:
      智力:
      感知:
      魅力:
      # WOD
      # 生理系
      力量:
      敏捷:
      耐力:
      # 心智系
      智力:
      感知:
      决心:
      # 互动系
      风度:
      操控:
      沉着:
      # FATE，命运阶梯，但是把档位改为英文字母(F/F+/E/E+/D/D+/C/C+/B/B+/A/A+/S/S+/EX)
      # 肉体与战斗
      体格:
      运动:
      近战: # 原肉搏，为避免不了解fate core的用户误解改为近战
      射击:
      # 感知与社交
      察觉:
      共情:
      交际:
      欺诈:
      挑衅:
      人脉:
      # 智慧与技术
      调查:
      学识:
      工艺:
      盗窃:
      潜行:
      驾驶:
      财富:
      意志:
    特殊: # 字典，AI根据世界观给出的特殊属性，可选项
    技能: # 主动能力
    特质: # 被动能力
    # 资产组
    物品:
      物品ID:
        物品名:
        数量:
        类型: # 装备/道具/消耗/关键/杂物
        描述: # 用户视角下物品的描述
        真实描述: # 物品真实的描述，只需要写与描述不同的地方即可
        equipped:
    资金: # AI 根据剧本世界观自主定义货币种类与数量
    座驾: # 角色的坐骑或载具，可选项
      座驾ID:
        座驾名:
        类型: # 坐骑/载具/装甲
        描述:
        真实描述:
        状态:
        equipped:







    不动产: # 可选项
      不动产ID:
        不动产名:
        产权人:
        位置:
        描述:
        真实描述:
        建设: # 字典，记录该不动产有哪些建设或发展
        





